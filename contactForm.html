    <style>
        /* --- RESET & GLOBAL STYLES --- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .navbar navbar-expand-lg navbar-dark bg-dark{

        body {

        }

        /* Keyboard Focus Indicator Style */

        /* --- HERO CONTAINER --- */
        .hero {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            background-color: #0f172a; /* Dark background fallback */
            /* High-performance background image with dark overlay mix-blend */
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            color: #ffffff;
        }

        .hero-content {
            max-width: 800px;
            text-align: center;
            margin: 0 auto;
        }

        /* --- TYPOGRAPHY STYLING --- */
        .hero-tag {
            display: inline-block;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #60a5fa; /* Crisp blue contrast over dark blue background */
            margin-bottom: 1rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4rem); /* Responsive typography */
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        .hero-description {
            font-size: clamp(1.125rem, 2vw, 1.25rem);
            line-height: 1.6;
            color: #e2e8f0; /* Off-white ensures long-form reading comfort */
            max-width: 650px; /* Limits characters per line for high readability */
            margin: 0 auto 2.5rem auto;
        }

        /* --- BUTTONS & INTERACTIVE ELEMENTS --- */
        .cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0.375rem;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            
            /* Strict Fitts' Law Rule: Generous sizing for precise touch targeting */
            min-height: 48px; 
            padding: 0 1.75rem;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            border: 2px solid #2563eb;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* --- ACCESSIBLE ICON SYSTEM --- */
        .btn-icon {
            margin-left: 0.5rem; /* Strict rule: deliberate spacing near text labels */
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
        }
    </style>

</head>
<body>
    <section class="hero">
  <h1>Contact Us</h1>
  
  <form id="contactForm">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>
    
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>
    
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="4" cols="40" required></textarea><br><br>
    
    <button type="submit">Send</button>
  </form>
  </section>
 <script>
document.getElementById("contactForm").addEventListener("submit", function(event) {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let message = document.getElementById("message").value.trim();

    // Name validation
    if (name.length < 3) {
        alert("Name must be at least 3 characters long.");
        event.preventDefault();
    }

    // Email validation (basic check)
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        alert("Please enter a valid email address.");
        event.preventDefault();
    }

    // Message validation
    if (message.length < 10) {
        alert("Message must be at least 10 characters long.");
        event.preventDefault();
    }
});
</script>
